<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester-Wise GPA Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            font-size: 0.9rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.05rem, 4vw, 1.4rem);
            color: var(--primary);
        }

        .gpa-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #e0e7ff;
            padding: 10px 28px;
            border-radius: 12px;
            line-height: 1.1;
        }

        .gpa-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #4338ca;
        }

        .gpa-value {
            font-size: clamp(2.6rem, 14vw, 4rem);
            font-weight: 800;
            color: var(--primary);
        }

        @media (min-width: 640px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                text-align: left;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            align-items: end;
        }

        @media (min-width: 640px) {
            .form-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .form-grid button {
                grid-column: 1 / -1;
            }
        }

        @media (min-width: 900px) {
            .form-grid {
                grid-template-columns: 2fr 2fr 1fr 1fr 1fr auto;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 3px;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .form-grid button {
            width: 100%;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
            word-break: break-word;
        }

        th {
            font-weight: 600;
            color: #64748b;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .semester-section {
            margin-bottom: 24px;
        }

        .semester-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 10px 16px;
            border-radius: 6px 6px 0 0;
            font-weight: bold;
            font-size: 0.95rem;
        }

        th, .delete-btn, .status-cell {
            white-space: nowrap;
        }

        .code-input {
            min-width: 110px;
        }

        .name-input {
            min-width: 220px;
        }

        .table-grade-select {
            min-width: 76px;
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fff;
            font-size: 0.85rem;
        }

        .table-edit-input {
            width: 100%;
            padding: 4px 6px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            font-size: 0.85rem;
            font-family: inherit;
            color: inherit;
        }

        .table-edit-input:hover {
            border-color: var(--border);
        }

        .table-edit-input:focus {
            border-color: var(--primary);
            background: #fff;
            outline: none;
        }

        .delete-btn {
            background: #ef4444;
            padding: 4px 8px;
            font-size: 0.75rem;
            width: auto;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            header {
                padding: 14px;
            }

            .card {
                padding: 14px;
            }

            .semester-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                font-size: 0.9rem;
            }

            /* 16px+ stops iOS Safari from auto-zooming the page when a field is tapped */
            input, select, .table-edit-input, .table-grade-select {
                font-size: 16px;
            }
        }

        .delete-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

        <h1>Semester-Wise Academic Tracker</h1>
        <div class="gpa-hero">

    </header>

    <div class="card">

        <p style="margin: -6px 0 0; color: #64748b; font-size: 0.8rem;">

        </p>
        <div id="syncStatus" style="margin-top:10px; font-size:0.8rem; font-weight:600;"></div>
    </div>

    <div class="card">
        <h2>Add Course Result</h2>
        <form id="courseForm" class="form-grid">
            <div class="input-group">
                <label for="semester">Semester</label>
                <select id="semester" required>
                    <option value="100 Level Semester I">100 Level Semester I</option>
                    <option value="100 Level Semester II">100 Level Semester II</option>
                    <option value="200 Level Semester I">200 Level Semester I</option>
                    <option value="200 Level Semester II">200 Level Semester II</option>
                    <option value="300 Level Semester I">300 Level Semester I</option>
                    <option value="300 Level Semester II">300 Level Semester II</option>
                    <option value="400 Level Semester I">400 Level Semester I</option>
                    <option value="400 Level Semester II">400 Level Semester II</option>
                </select>
            </div>
            <div class="input-group">
                <label for="courseCode">Course Code</label>
                <input type="text" id="courseCode" required placeholder="e.g. CST 124-2">
            </div>
            <div class="input-group">
                <label for="courseName">Course Name</label>
                <input type="text" id="courseName" required placeholder="e.g. Web Dev">
            </div>
            <div class="input-group">
                <label for="credits">Credits</label>
                <input type="number" id="credits" min="1" max="10" required placeholder="e.g. 2">
            </div>
            <div class="input-group">
                <label for="grade">Grade</label>
                <select id="grade" required>
                    <option value="4.0|A+">A+</option>
                    <option value="4.0|A">A</option>
                    <option value="3.7|A-">A-</option>
                    <option value="3.3|B+">B+</option>
                    <option value="3.0|B">B</option>
                    <option value="2.7|B-">B-</option>
                    <option value="2.3|C+">C+</option>
                    <option value="2.0|C">C</option>
                    <option value="1.3|D+">D+</option>
                    <option value="1.0|D">D</option>
                    <option value="0.0|E / F">E / F</option>
                </select>
            </div>
            <div class="input-group">
                <label for="isGPA">Include in GPA</label>
                <select id="isGPA">
                    <option value="true">Yes</option>
                    <option value="false">No (Non-GPA)</option>
                </select>
            </div>
            <button type="submit" style="grid-column: 1 / -1;">Add Course</button>
        </form>
        <div id="formMessage" style="display:none; margin-top:12px; padding:10px 14px; border-radius:6px; font-size:0.85rem; font-weight:600;"></div>
    </div>

    <div class="card" id="semestersContainer">
        <h2>Results by Semester</h2>
    </div>
</div>

    function loadCourses() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                return JSON.parse(saved);
            } catch (e) {
                return JSON.parse(JSON.stringify(defaultCourses));
            }
        }
        return JSON.parse(JSON.stringify(defaultCourses));
    }

    // Fixed document ID shared by every device that loads this page, so there's
    // always exactly one database everyone reads from and writes to.
    const FIXED_SYNC_CODE = '01bc6952-1903-426a-9d1c-84dabc8aecfc';
    let cloudUnsubscribe = null;
    let applyingRemoteUpdate = false;
    let lastKnownUpdatedAt = 0;

    // Bump DATA_VERSION and list the semesters whose defaults were corrected; the cloud
    // copy then has just those semesters replaced once, leaving other edits untouched.
    const DATA_VERSION = 4;
    const CORRECTED_SEMESTERS = ["100 Level Semester I", "100 Level Semester II", "300 Level Semester II"];

    function applyCorrections(list) {
        const kept = list.filter(c => !CORRECTED_SEMESTERS.includes(c.semester));
        const corrected = defaultCourses.filter(c => CORRECTED_SEMESTERS.includes(c.semester));
        return JSON.parse(JSON.stringify(corrected)).concat(kept);
    }

    function saveCourses() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(courses));
        } catch (e) {
            console.error('Failed to save courses to localStorage:', e);
            return false;
        }
        if (!applyingRemoteUpdate) {
            pushToCloud();
        }
        return true;
    }

    async function pushToCloud() {
        if (!FIREBASE_READY || !db) return;
        const writeTime = Date.now();
        lastKnownUpdatedAt = writeTime;
        try {
            await setDoc(doc(db, 'gpaTrackers', FIXED_SYNC_CODE), { courses, updatedAt: writeTime, dataVersion: DATA_VERSION });
        } catch (err) {
            console.error('Firestore write failed:', err);
            setSyncStatus('Could not save to cloud: ' + err.message, false);
        }
    }

    function setSyncStatus(text, ok) {
        syncStatus.textContent = text;
        syncStatus.style.color = ok ? '#15803d' : '#b91c1c';
    }

    function connectToCloud() {
        if (!FIREBASE_READY) {
            setSyncStatus("Cloud sync isn't configured on this deployment yet — using local-only storage.", false);
            return;
        }
        if (cloudUnsubscribe) cloudUnsubscribe();
        setSyncStatus('Connecting...', true);

        const ref = doc(db, 'gpaTrackers', FIXED_SYNC_CODE);
        cloudUnsubscribe = onSnapshot(ref, (snap) => {
            if (snap.exists()) {
                const data = snap.data();
                const remoteUpdatedAt = data.updatedAt || 0;
                if (remoteUpdatedAt < lastKnownUpdatedAt) {
                    // This snapshot is older than an edit we already made locally — ignore it
                    // so it can't overwrite a newer local change (fixes "added course disappears").
                    setSyncStatus('Connected — synced across devices.', true);
                    return;
                }
                lastKnownUpdatedAt = remoteUpdatedAt;
                if ((data.dataVersion || 0) < DATA_VERSION) {
                    courses = applyCorrections(data.courses || []);
                    saveCourses();
                    renderTracker();
                    setSyncStatus('Connected — corrected results applied and synced.', true);
                    return;
                }
                applyingRemoteUpdate = true;
                courses = data.courses || [];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(courses));
                renderTracker();
                applyingRemoteUpdate = false;
                setSyncStatus('Connected — synced across devices.', true);
            } else {
                courses = applyCorrections(courses);
                renderTracker();
                setDoc(ref, { courses, updatedAt: Date.now(), dataVersion: DATA_VERSION }).catch(err => {
                    console.error('Firestore initial write failed:', err);
                    setSyncStatus('Could not reach cloud storage: ' + err.message, false);
                });
                setSyncStatus('Connected — this device is now the source for this data.', true);
            }
        }, (err) => {
            console.error('Firestore listener error:', err);
            setSyncStatus('Cloud sync error: ' + err.message, false);
        });
    }

    const formMessage = document.getElementById('formMessage');
    let formMessageTimer = null;

    function showFormMessage(text, type) {
        clearTimeout(formMessageTimer);
        formMessage.textContent = text;
        formMessage.style.display = 'block';
        if (type === 'error') {
            formMessage.style.background = '#fee2e2';
            formMessage.style.color = '#b91c1c';
        } else {
            formMessage.style.background = '#dcfce7';
            formMessage.style.color = '#15803d';
        }
        formMessageTimer = setTimeout(() => {
            formMessage.style.display = 'none';
        }, 4000);
    }

    let courses = loadCourses();

    function escapeAttr(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    const courseForm = document.getElementById('courseForm');
    const semestersContainer = document.getElementById('semestersContainer');
    const overallGPASpan = document.getElementById('overallGPA');
    const syncStatus = document.getElementById('syncStatus');

    function renderTracker() {
        semestersContainer.innerHTML = '<h2>Results by Semester</h2>';
        
        const semestersList = [
            "100 Level Semester I", "100 Level Semester II",
            "200 Level Semester I", "200 Level Semester II",
            "300 Level Semester I", "300 Level Semester II",
            "400 Level Semester I", "400 Level Semester II"
        ];

        let totalPoints = 0;
        let totalCredits = 0;

        semestersList.forEach(semName => {
            const semCourses = courses.filter(c => c.semester === semName);
            
            let semPoints = 0;
            let semCredits = 0;

            semCourses.forEach(c => {
                if (c.includeGPA) {
                    semPoints += c.gradePoint * c.credits;
                    semCredits += c.credits;
                }
            });

            const semGPA = semCredits > 0 ? (semPoints / semCredits).toFixed(2) : '0.00';

            totalPoints += semPoints;
            totalCredits += semCredits;

            const section = document.createElement('div');
            section.className = 'semester-section';
            
            let tableRows = '';
            courses.forEach((course, index) => {
                if (course.semester === semName) {
                    let dropdownOptions = '';
                    gradeOptionsConfig.forEach(opt => {
                        const isSelected = (opt.text === course.gradeText && opt.point === course.gradePoint) ? 'selected' : '';
                        dropdownOptions += `<option value="${opt.point}|${opt.text}" ${isSelected}>${opt.text}</option>`;
                    });

                    tableRows += `
                        <tr>
                            <td><input class="table-edit-input code-input" style="font-weight:600;" type="text" value="${escapeAttr(course.code)}" onchange="updateCourseField(${index}, 'code', this.value)"></td>
                            <td><input class="table-edit-input name-input" type="text" value="${escapeAttr(course.name)}" onchange="updateCourseField(${index}, 'name', this.value)"></td>
                            <td><input class="table-edit-input" type="number" min="1" max="10" style="width:60px; min-width:60px;" value="${course.credits}" onchange="updateCourseField(${index}, 'credits', this.value)"></td>
                            <td>
                                <select class="table-grade-select" onchange="updateCourseGrade(${index}, this.value)">
                                    ${dropdownOptions}
                                </select>
                            </td>
                            <td class="status-cell">${course.includeGPA ? 'Included' : 'Non-GPA'}</td>
                            <td><button class="delete-btn" onclick="deleteCourse(${index})">Delete</button></td>
                        </tr>
                    `;
                }
            });

            section.innerHTML = `
                <div class="semester-header">
                    <span>${semName}</span>
                    <span>Semester GPA: ${semGPA}</span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Course Name</th>
                                <th>Credits</th>
                                <th>Grade</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows || '<tr><td colspan="6" style="text-align:center; color:#64748b;">No courses added yet.</td></tr>'}
                        </tbody>
                    </table>
                </div>
            `;
            semestersContainer.appendChild(section);
        });

        const overallGPA = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : '0.00';
        overallGPASpan.textContent = overallGPA;
    }

    courseForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const semester = document.getElementById('semester').value;
        const code = document.getElementById('courseCode').value.trim();
        const name = document.getElementById('courseName').value.trim();
        const creditsRaw = document.getElementById('credits').value;
        const credits = parseFloat(creditsRaw);
        const gradeValue = document.getElementById('grade').value.split('|');
        const gradePoint = parseFloat(gradeValue[0]);
        const gradeText = gradeValue[1];
        const includeGPA = document.getElementById('isGPA').value === 'true';

        if (!code) {
            showFormMessage('Please enter a Course Code.', 'error');
            document.getElementById('courseCode').focus();
            return;
        }
        if (!name) {
            showFormMessage('Please enter a Course Name.', 'error');
            document.getElementById('courseName').focus();
            return;
        }
        if (!creditsRaw || isNaN(credits) || credits <= 0) {
            showFormMessage('Please enter valid Credits (a number greater than 0). Note: the "2" shown is just a placeholder hint, not an actual value.', 'error');
            document.getElementById('credits').focus();
            return;
        }

        courses.push({ semester, code, name, credits, gradePoint, gradeText, includeGPA });
        const saved = saveCourses();
        renderTracker();
        courseForm.reset();

        if (saved) {
            showFormMessage(`Added "${code} - ${name}" successfully.`, 'success');
        } else {
            showFormMessage('Course added, but could not be saved to this browser\'s storage (it may be full or disabled in private browsing). It will be lost on reload.', 'error');
        }
    });

    window.updateCourseGrade = function(index, val) {
        const parts = val.split('|');
        courses[index].gradePoint = parseFloat(parts[0]);
        courses[index].gradeText = parts[1];
        saveCourses();
        renderTracker();
    }

    window.updateCourseField = function(index, field, value) {
        if (field === 'credits') {
            const parsed = parseFloat(value);
            courses[index].credits = isNaN(parsed) || parsed <= 0 ? 1 : parsed;
        } else {
            courses[index][field] = value;
        }
        saveCourses();
        renderTracker();
    }

    window.deleteCourse = function(index) {
        courses.splice(index, 1);
        saveCourses();
        renderTracker();
    }

    renderTracker();
    connectToCloud();
</script>

</body>
</html>
